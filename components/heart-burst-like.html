:root {

  --ux-surface: rgba(255, 255, 255, 0.92);
  --ux-surface-2: #f5f3ef;
  --ux-surface-3: #eae7e1;
  --ux-ink: var(--color-text, #0f172a);
  --ux-ink-2: var(--color-text-muted, #64748b);
  --ux-ink-3: #94a3b8;
  --ux-line: var(--color-border, rgba(226, 232, 240, 0.85));
  --ux-line-2: rgba(22, 21, 27, 0.17);
  --ux-accent: var(--color-accent, #c49a45);
  --ux-accent-2: #2f8fe0;
  --ux-accent-soft: rgba(196, 154, 69, 0.15);
  --ux-accent-ink: #ffffff;
  --ux-mint: #119c72;
  --ux-warn: #d6731e;
  --ux-danger: #d93a55;
  --ux-glass: rgba(255, 255, 255, 0.58);
  --ux-glass-line: rgba(255, 255, 255, 0.85);
  --ux-shadow: var(--shadow-sm, rgba(40, 30, 80, 0.14));
  --ux-shadow-strong: var(--shadow-md, rgba(40, 30, 80, 0.3));
  --ux-grad: linear-gradient(120deg, #7b61ff, #3d8bff 55%, #1fb89a);
  --ux-ease: cubic-bezier(.2, .8, .2, 1);
  --ux-spring: cubic-bezier(.34, 1.45, .64, 1);
}

:root[data-theme="dark"],
body.dark-theme {
  --ux-page: var(--color-bg, #090a0f);
  --ux-surface: rgba(18, 20, 30, 0.85);
  --ux-surface-2: #161824;

  --ux-ink-2: var(--color-text-muted, #94a3b8);

  --ux-line: var(--color-border, rgba(255, 255, 255, 0.16));
  --ux-line-2: rgba(255, 255, 255, 0.22);
  --ux-accent: var(--color-accent, #e5b95d);
  --ux-accent-2: #7db4ff;
  --ux-accent-soft: rgba(229, 185, 93, 0.2);
  --ux-accent-ink: #090a0f;
  --ux-mint: #7ee8c0;
  --ux-warn: #ffb26b;
  --ux-danger: #ff7d8c;
  --ux-glass: rgba(255, 255, 255, 0.07);
  --ux-glass-line: rgba(255, 255, 255, 0.18);
  --ux-shadow: var(--shadow-sm, rgba(0, 0, 0, 0.45));
  --ux-shadow-strong: var(--shadow-md, rgba(0, 0, 0, 0.72));
  --ux-grad: linear-gradient(120deg, #b7a4ff, #7db4ff 55%, #a5f2d3);
}

/* Card favorite container positioning */
.card-fav-u022 {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  pointer-events: auto;
}

/* Scaler preserves original 112px micro-interaction coordinate space */
.card-fav-u022 .u022-scaler {
  width: 112px;
  height: 112px;
  transform: scale(0.3571); /* 112 * 0.3571 = 40px */
  transform-origin: center center;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Base button */
.u022-btn {
  position: relative;
  width: 112px;
  height: 112px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: var(--ux-surface);
  color: var(--ux-ink-2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  box-shadow: 0 0 0 1px var(--ux-line), 0 24px 40px -24px var(--ux-shadow-strong);
  transition: transform .45s var(--ux-spring), box-shadow .5s var(--ux-ease), background .3s ease, color .3s ease;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.u022-btn:hover {
  transform: scale(1.05);
}

.u022-btn:active {
  transform: scale(.9);
}

.u022-btn:focus-visible {
  outline: 2px solid #FF4D6D;
  outline-offset: 5px;
}

.u022.is-on .u022-btn {
  box-shadow: 0 0 0 1px color-mix(in srgb, #FF4D6D 30%, transparent), 0 24px 44px -22px rgba(255, 77, 109, .65);
}

/* Heart element */
.u022-heart {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  margin: -24px 0 0 -26px;
  pointer-events: none;
}

.u022-heart svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.u022-o {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.6;
  stroke-linejoin: round;
  transition: stroke .2s var(--ux-ease);
}

.u022.is-on .u022-o {
  stroke: transparent;
}

.u022-f {
  transform-origin: 50% 55%;
  transform: scale(0);
  transition: transform .2s var(--ux-ease);
}

.u022.is-on .u022-f {
  transform: scale(1);
}

.u022.is-pop .u022-heart {
  animation: u022-beat .7s var(--ux-ease);
}

@keyframes u022-beat {
  0% { transform: scale(1); }
  18% { transform: scale(.72); }
  48% { transform: scale(1.24); }
  70% { transform: scale(.94); }
  100% { transform: scale(1); }
}

.u022.is-pop .u022-f {
  animation: u022-fill .7s var(--ux-ease);
}

@keyframes u022-fill {
  0%, 18% { transform: scale(0); }
  48% { transform: scale(1); }
}

/* Ring burst */
.u022-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 140px;
  height: 140px;
  margin: -70px;
  border-radius: 50%;
  border: 12px solid #FF7A93;
  transform: scale(0);
  opacity: 0;
  pointer-events: none;
}

.u022.is-pop .u022-ring {
  animation: u022-ring .6s var(--ux-ease) .1s;
}

@keyframes u022-ring {
  0% { transform: scale(.3); opacity: 1; border-width: 22px; }
  100% { transform: scale(1); opacity: 0; border-width: 0; }
}

/* Flying particles */
.u022-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  pointer-events: none;
  transform: rotate(var(--a));
}

.u022-dot i {
  position: absolute;
  width: 9px;
  height: 9px;
  margin: -4.5px;
  border-radius: 50%;
  background: var(--c);
  opacity: 0;
}

.u022-dot i + i {
  width: 6px;
  height: 6px;
  margin: -3px;
  background: var(--c2);
}

.u022.is-pop .u022-dot i {
  animation: u022-fly .7s var(--ux-ease) .18s;
}

.u022.is-pop .u022-dot i + i {
  animation-name: u022-fly2;
}

@keyframes u022-fly {
  0% { opacity: 1; transform: translate(0, -46px) scale(1); }
  100% { opacity: 0; transform: translate(0, -84px) scale(.2); }
}

@keyframes u022-fly2 {
  0% { opacity: 1; transform: translate(9px, -40px) scale(1); }
  100% { opacity: 0; transform: translate(16px, -74px) scale(.2); }
}

/* Accessibility: prefers-reduced-motion */
@media (prefers-reduced-motion: reduce) {
  .u022, .u022 *, .u022 *::before, .u022 *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
